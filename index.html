<title>IELTS每日單字</title>
<style>
:root{
  --bg:#0e1216; --panel:#161c23; --panel-2:#1c242d; --line:#28323d;
  --ink:#e8edf2; --ink-dim:#9aa7b4; --ink-faint:#5f6d7a;
  --accent:#4db6a0; --accent-ink:#0e1216;
  --gold:#e0a95e; --rose:#d47a72; --rose-dim:#3a2422;
  --good:#4db6a0; --good-dim:#1e2e2a;
  --r:14px; --r-sm:10px;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC",sans-serif;
  --serif:"Iowan Old Style","Palatino Linotype","Songti TC",Georgia,serif;
  --safe-t:env(safe-area-inset-top,0px); --safe-b:env(safe-area-inset-bottom,0px);
  --safe-l:env(safe-area-inset-left,0px); --safe-r:env(safe-area-inset-right,0px);
}
/* Auto light theme — every rule in this stylesheet is written against the
   CSS custom properties above, so overriding them here re-themes the whole
   app without touching a single component rule. Falls back to the dark
   palette (the :root block above) whenever the OS is in dark mode or the
   browser doesn't support prefers-color-scheme at all. */
@media (prefers-color-scheme: light){
  :root{
    --bg:#f6f7f9; --panel:#ffffff; --panel-2:#eef1f4; --line:#dde3e9;
    --ink:#1a2027; --ink-dim:#5a6672; --ink-faint:#8b96a1;
    --accent:#2f9683; --accent-ink:#ffffff;
    --gold:#a8720f; --rose:#c1524b; --rose-dim:#fbe4e1;
    --good:#2f9683; --good-dim:#e1f2ee;
  }
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg);color:var(--ink);font-family:var(--sans);
  -webkit-font-smoothing:antialiased;overscroll-behavior:none}
/* 100vh can be miscalculated on iOS Safari when the address-bar chrome
   collapses/expands (especially once "加入主畫面" launches standalone) —
   100dvh tracks the real, current visible viewport so nothing at the very
   bottom (buttons, footer) ever ends up hidden below an invisible fold. */
body{min-height:100vh; min-height:100dvh; line-height:1.55}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;
  touch-action:manipulation;-webkit-user-select:none;user-select:none}
select{touch-action:manipulation}
/* safe-area padding on all four sides: top/bottom keep content clear of the
   iPhone notch/Dynamic Island and the home-indicator swipe zone in standalone
   mode; left/right protect against the notch cutout in landscape on iPad/iPhone */
.wrap{max-width:640px;margin:0 auto;padding:
  calc(var(--safe-t) + 20px) calc(var(--safe-r) + 18px)
  calc(var(--safe-b) + 32px) calc(var(--safe-l) + 18px)}

/* ---- header ---- */
.top{display:flex;align-items:baseline;justify-content:space-between;
  margin-bottom:22px;gap:12px}
.titlewrap{display:flex;flex-direction:column;gap:4px}
.backlink{display:inline-block;font-size:13px;color:var(--ink-dim);
  padding:9px 13px;margin:0 0 12px -3px;font-weight:600;transition:.12s;
  position:sticky;top:calc(var(--safe-t) + 8px);z-index:30;
  background:var(--panel);border:1px solid var(--line);border-radius:20px;
  -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.backlink:active{color:var(--accent);transform:scale(.96);background:var(--panel-2)}
.brand{font-family:var(--serif);font-size:23px;font-weight:600;letter-spacing:-.01em}
.brand .en{color:var(--accent);font-style:italic}
.streak{font-size:13px;color:var(--ink-dim);white-space:nowrap;
  background:var(--panel);padding:6px 11px;border-radius:20px;border:1px solid var(--line)}
.streak b{color:var(--gold);font-variant-numeric:tabular-nums}

/* ---- cover: compact header (branding only, kept small on purpose) ---- */
.cover-compact{display:flex;align-items:center;gap:12px;margin-bottom:20px}
.appicon-sm{flex-shrink:0;width:44px;height:44px;border-radius:12px;overflow:hidden;
  box-shadow:0 6px 16px -6px rgba(77,182,160,.5), 0 0 0 1px rgba(255,255,255,.06)}
.appicon-sm svg{width:100%;height:100%;display:block}
.cover-titlewrap{min-width:0;flex:1}
.cover-title-sm{font-family:var(--serif);font-size:19px;font-weight:700;
  letter-spacing:-.01em;line-height:1.2}
.cover-title-sm .en{color:var(--accent);font-style:italic}
.cover-quickstat{font-size:11px;color:var(--ink-faint);margin-top:3px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cover-quickstat b{color:var(--ink-dim);font-variant-numeric:tabular-nums;font-weight:700}

/* ---- cover: secondary section (deliberately de-emphasized) ---- */
.cover-secondary{margin-top:24px;padding-top:18px;border-top:1px solid var(--line);
  text-align:center}
.visitbar-mini{font-size:11px;color:var(--ink-faint)}
.visitbar-mini b{color:var(--ink-faint);font-variant-numeric:tabular-nums}
.secondarylink{display:block;margin:10px auto 0;font-size:12px;color:var(--ink-faint);
  padding:8px 10px;text-decoration:underline;text-decoration-color:var(--line);
  text-underline-offset:3px}
.secondarylink:active{color:var(--ink-dim)}
.cover-foot{text-align:center;font-size:10.5px;color:var(--ink-faint);
  margin-top:14px;letter-spacing:.04em;opacity:.6}

/* ---- weekly progress ---- */
.weekcard{margin-top:14px}
.weekhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;gap:8px}
.weekhead h2{margin:0;white-space:nowrap}
.weeknav{display:flex;align-items:center;gap:6px;min-width:0}
.weeknavbtn{flex-shrink:0;width:28px;height:28px;border-radius:50%;background:var(--panel-2);
  border:1px solid var(--line);color:var(--ink-dim);font-size:15px;font-weight:700;
  display:flex;align-items:center;justify-content:center;transition:.12s}
.weeknavbtn:active{background:var(--good-dim);color:var(--accent);transform:scale(.9)}
.weeknavbtn:disabled{opacity:.3}
.weeknavbtn:disabled:active{transform:none;background:var(--panel-2);color:var(--ink-dim)}
.weekgoalbtn{font-size:11.5px;color:var(--gold);background:var(--rose-dim);
  border:1px solid rgba(224,169,94,.3);border-radius:20px;padding:9px 12px;white-space:nowrap;
  flex-shrink:0}
.weekgoalbtn:active{transform:scale(.95)}
.backtocurrent{width:100%;margin-top:14px;font-size:12px;padding:10px}
.weekstrip{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-bottom:14px}
.wdcell{display:flex;flex-direction:column;align-items:center;gap:5px;
  padding:8px 0;border-radius:10px;background:var(--panel-2);border:1px solid var(--line)}
.wdcell.today{border-color:var(--accent)}
.wdcell.done{background:var(--good-dim);border-color:var(--accent)}
.wdcell.future{opacity:.42}
.wdcell.planned:not(.done){border-style:dashed;border-color:var(--gold)}
.wdcell.missed{border-color:var(--rose);background:var(--rose-dim)}
.wdlabel{font-size:10.5px;color:var(--ink-faint)}
.wdcell.done .wdlabel{color:var(--accent)}
.wdcell.missed .wdlabel{color:var(--rose)}
.wddot{width:18px;height:18px;border-radius:50%;display:flex;align-items:center;
  justify-content:center;font-size:10px;color:var(--accent);font-weight:700}
.wdcell.planned:not(.done) .wddot{color:var(--gold);font-size:16px}
.wdcell.missed .wddot{color:var(--rose)}
.weeksum-main{font-size:14px;font-weight:700}
.weeksum-main.met{color:var(--accent)}
.weeksum-main b{color:var(--accent);font-variant-numeric:tabular-nums}
.weeksum-detail{font-size:11.5px;color:var(--ink-faint);margin-top:3px}
.weeksum-detail.muted-hint{font-style:italic;opacity:.85}

/* ---- weekly goal screen ---- */
.goalcard{text-align:center;padding:30px 18px}
.goalbig{margin-bottom:22px}
.goalbig b{font-family:var(--serif);font-size:44px;font-weight:800;color:var(--accent);
  font-variant-numeric:tabular-nums;display:block;line-height:1}
.goalbig span{font-size:12.5px;color:var(--ink-faint)}
.goalstepper{display:flex;align-items:center;gap:14px;margin-bottom:16px}
.stepbtn{flex-shrink:0;width:44px;height:44px;border-radius:50%;background:var(--panel-2);
  border:1px solid var(--line);font-size:18px;color:var(--ink-dim);font-weight:700}
.stepbtn:active{background:var(--good-dim);color:var(--accent);transform:scale(.92)}
.goalstepper input[type=range]{flex:1;accent-color:var(--accent)}
.goalhint{font-size:12.5px;color:var(--ink-faint)}

/* ---- weekly plan rows ---- */
.planlist{display:flex;flex-direction:column;gap:8px}
.planrow{display:flex;align-items:center;gap:10px;padding:9px 4px;
  border-bottom:1px solid var(--line)}
.planrow:last-child{border-bottom:none}
.planrow.today{background:var(--good-dim);border-radius:var(--r-sm);padding:9px 8px;
  border-bottom:none}
.plandate{flex-shrink:0;width:52px;display:flex;flex-direction:column;line-height:1.3}
.plw{font-size:12.5px;font-weight:700}
.pld{font-size:10px;color:var(--ink-faint);font-variant-numeric:tabular-nums}
.planselect{flex:1;min-width:0;background:var(--panel-2);color:var(--ink);
  border:1px solid var(--line);border-radius:8px;padding:11px 8px;font-size:12.5px;
  font-family:inherit;min-height:40px}
.planstatus{flex-shrink:0;width:20px;text-align:center;font-size:14px;color:var(--accent);
  font-weight:700}

/* ---- smart insight card ---- */
.insightcard{margin-top:14px}
.insightline{font-size:13px;color:var(--ink-dim);margin-top:6px}
.insightline:first-of-type{margin-top:10px}
.insightline b{color:var(--accent);font-variant-numeric:tabular-nums}

/* ---- mode cards ---- */
.modewrap{display:flex;flex-direction:column;gap:11px}
.modecard{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);
  padding:16px 15px;display:flex;align-items:center;gap:13px;text-align:left;
  transition:.16s;width:100%}
.modecard:active{transform:scale(.985);background:var(--panel-2)}
.mc-ico{font-size:25px;flex-shrink:0;width:44px;height:44px;border-radius:12px;
  background:var(--panel-2);display:flex;align-items:center;justify-content:center}
.mc-body{flex:1;min-width:0}
.mc-title{font-family:var(--serif);font-size:17px;font-weight:700;margin-bottom:3px}
.mc-sub{font-size:12px;color:var(--ink-faint);line-height:1.45}
.mc-go{font-size:21px;color:var(--ink-faint);flex-shrink:0;line-height:1}

/* ---- wordbook list ---- */
.wblist{display:flex;flex-direction:column}
.wbrow{display:flex;align-items:center;gap:8px;padding:12px 10px;
  border-bottom:1px solid var(--line);transition:opacity .2s}
.wbrow:last-child{border-bottom:none}
.wbn{font-size:11px;color:var(--ink-faint);width:20px;flex-shrink:0;
  font-variant-numeric:tabular-nums}
.wben{font-family:var(--serif);font-style:italic;font-size:15.5px;font-weight:600;
  flex:1.3;min-width:0}
.wbzh{font-size:14px;color:var(--ink-dim);flex:1;text-align:right;cursor:pointer;transition:.12s}
.wbzh.masked{color:var(--ink-faint);background:var(--panel-2);border:1px dashed var(--line);
  border-radius:8px;padding:3px 8px;font-size:12px;letter-spacing:.05em;display:inline-block}
.wbzh.masked:active{transform:scale(.95);background:var(--good-dim);border-color:var(--accent)}
.wbmaster{flex-shrink:0;font-size:11px;color:var(--ink-faint);background:var(--panel-2);
  border:1px solid var(--line);border-radius:20px;padding:8px 12px;white-space:nowrap;
  transition:.15s;min-height:34px}
.wbmaster.on{background:var(--good-dim);color:var(--accent);border-color:var(--accent)}
.wbmaster:active{transform:scale(.94)}
.volbtn{flex-shrink:0;width:32px;height:32px;border-radius:8px;
  background:transparent;border:none;color:var(--ink-faint);
  display:flex;align-items:center;justify-content:center;transition:.15s;padding:0;margin:0 -5px}
.volbtn:active{transform:scale(.88);color:var(--accent);background:var(--good-dim)}
.volbtn.playing{color:var(--accent);background:var(--good-dim)}
.wbrow.mastered{opacity:.4}
.wbrow.mastered .wben{font-weight:500}
.masktoggle{font-size:12px;color:var(--ink-dim);white-space:nowrap;
  background:var(--panel);padding:10px 13px;border-radius:20px;border:1px solid var(--line);
  flex-shrink:0;transition:.12s}
.masktoggle:active{background:var(--panel-2);transform:scale(.95)}

/* ---- generic card ---- */
.card{background:var(--panel);border:1px solid var(--line);
  border-radius:var(--r);padding:18px;margin-bottom:14px}
.card h2{font-size:12px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;
  color:var(--ink-faint);margin-bottom:14px;display:flex;align-items:center;gap:8px}
.card h2::before{content:"";width:14px;height:2px;background:var(--accent);border-radius:2px}
.weekhead h2::before{display:none}

/* ---- theme grid ---- */
.themes{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-bottom:14px}
.themes:last-of-type{margin-bottom:0}
.dbdivider{display:flex;align-items:center;gap:10px;margin:18px 0 12px;
  font-size:12.5px;font-weight:700;color:var(--accent);letter-spacing:.02em}
.dbdivider:first-child{margin-top:2px}
.dbdivider::before,.dbdivider::after{content:"";flex:1;height:1px;background:var(--line)}
.theme.allbanks{background:linear-gradient(135deg,rgba(224,169,94,.10),var(--panel) 62%);
  border-color:rgba(224,169,94,.35);margin-top:6px}
.theme{background:var(--panel-2);border:1px solid var(--line);border-radius:var(--r-sm);
  padding:12px 13px;text-align:left;transition:.15s;position:relative;overflow:hidden}
.theme:active{transform:scale(.98)}
.theme.sel{border-color:var(--accent);background:var(--good-dim)}
.theme .tn{font-size:13.5px;font-weight:600;line-height:1.3;margin-bottom:5px;
  display:block;min-height:2.6em}
.theme .tzh{display:block;font-size:11px;font-weight:400;color:var(--ink-faint);margin-top:2px}
.theme .tm{font-size:11px;color:var(--ink-faint);font-variant-numeric:tabular-nums;
  display:flex;justify-content:space-between;align-items:center}
.theme .acc{color:var(--accent);font-weight:600}
.theme .bar{position:absolute;bottom:0;left:0;height:2px;background:var(--accent);opacity:.5}
.theme.all{grid-column:1/-1;display:block;width:100%;background:linear-gradient(100deg,#1c242d,#20303a);
  text-align:center}
.theme.all .tn{min-height:auto;color:var(--accent)}

/* ---- options / controls ---- */
.opt-row{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.opt-row:last-child{margin-bottom:0}
.opt-hint{font-size:12px;color:var(--ink-faint);line-height:1.5;margin-top:2px}
.chipwrap{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:11px 15px;border-radius:20px;background:var(--panel-2);
  border:1px solid var(--line);font-size:13px;color:var(--ink-dim);font-weight:500;transition:.15s;
  min-height:40px}
.chip.on{background:var(--accent);color:var(--accent-ink);font-weight:700;border-color:var(--accent)}
.chip:active{transform:scale(.96)}
.opt-label{font-size:13px;color:var(--ink-dim);align-self:center;
  min-width:66px;flex-shrink:0}
.seg{display:flex;background:var(--panel-2);border:1px solid var(--line);
  border-radius:var(--r-sm);overflow:hidden;flex:1}
.seg button{flex:1;padding:9px 6px;font-size:13px;color:var(--ink-dim);
  font-weight:500;transition:.15s;border-right:1px solid var(--line)}
.seg button:last-child{border-right:none}
.seg button.on{background:var(--accent);color:var(--accent-ink);font-weight:600}

/* ---- primary button ---- */
.go{width:100%;background:var(--accent);color:var(--accent-ink);
  font-size:16px;font-weight:700;padding:16px;border-radius:var(--r);
  margin-top:4px;letter-spacing:.02em;transition:.15s}
.go:active{transform:scale(.99);filter:brightness(1.05)}
.go:disabled{background:var(--panel-2);color:var(--ink-faint)}
.go.rev{background:var(--gold)}
.ghost{width:100%;background:var(--panel);border:1px solid var(--line);
  color:var(--ink-dim);padding:13px;border-radius:var(--r);font-size:14px;
  font-weight:500;margin-top:9px}
.ghost:active{background:var(--panel-2)}

/* ---- quiz ---- */
.qhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.qmeta{font-size:13px;color:var(--ink-dim);font-variant-numeric:tabular-nums}
.qmeta b{color:var(--ink)}
.quit{font-size:13px;color:var(--ink-faint);padding:10px 12px;margin:-10px -12px 0 0;
  transition:.12s}
.quit:active{color:var(--rose);transform:scale(.95)}
.prog{height:5px;background:var(--panel-2);border-radius:3px;overflow:hidden;margin-bottom:22px}
.prog i{display:block;height:100%;background:var(--accent);border-radius:3px;
  transition:width .3s ease}
.qdir{font-size:12px;letter-spacing:.08em;text-transform:uppercase;
  color:var(--accent);font-weight:600;margin-bottom:10px}
.qword{font-size:34px;font-weight:700;line-height:1.25;margin-bottom:6px;
  word-break:break-word}
.qword.zh{font-family:var(--sans)}
.qword.en{font-family:var(--serif);font-style:italic;letter-spacing:-.01em}
.qword.def,.qword.cloze{font-size:22px;font-weight:500;line-height:1.4;
  font-family:var(--serif);font-style:normal;letter-spacing:0}
.qword .blank{color:var(--gold);font-weight:700;letter-spacing:1px;font-style:normal}
.qsub{font-size:13px;color:var(--ink-faint);margin-bottom:26px}
.choices{display:flex;flex-direction:column;gap:10px}
.choice{background:var(--panel-2);border:1.5px solid var(--line);border-radius:var(--r);
  padding:15px 16px;text-align:left;font-size:16px;transition:.12s;
  display:flex;align-items:center;gap:13px;min-height:54px}
.choice:active{transform:scale(.985)}
.choice.pick{border-color:var(--accent);background:var(--good-dim)}
.choice.correct{border-color:var(--good);background:var(--good-dim)}
.choice.correct .key{background:var(--good);color:var(--accent-ink);border-color:var(--good)}
.choice.wrong{border-color:var(--rose);background:var(--rose-dim)}
.choice.wrong .key{background:var(--rose);color:#fff;border-color:var(--rose)}
.choice.locked{cursor:default}
.choice.locked:active{transform:none}
.choice .key{width:24px;height:24px;border-radius:6px;background:var(--panel);
  border:1px solid var(--line);font-size:12px;font-weight:600;color:var(--ink-faint);
  display:flex;align-items:center;justify-content:center;flex-shrink:0}
.choice.pick .key{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.choice .ctext{flex:1}
.feedback{max-height:0;overflow:hidden;opacity:0;font-size:13.5px;font-weight:600;
  border-radius:var(--r-sm);transition:.22s ease;text-align:center}
.feedback.show{max-height:60px;opacity:1;margin-top:10px;padding:11px 14px}
.feedback.show.ok{background:var(--good-dim);color:var(--accent)}
.feedback.show.bad{background:var(--rose-dim);color:var(--rose)}
.qfoot{display:flex;gap:10px;margin-top:22px;align-items:center}
.flag{flex-shrink:0;width:52px;height:52px;border-radius:var(--r);
  background:var(--panel);border:1px solid var(--line);font-size:20px;
  display:flex;align-items:center;justify-content:center;transition:.15s}
.flag:active{transform:scale(.92)}
.flag.on{background:var(--rose-dim);border-color:var(--rose);color:var(--gold)}
.next{flex:1;background:var(--accent);color:var(--accent-ink);font-weight:700;
  font-size:16px;padding:15px;border-radius:var(--r);transition:.12s}
.next:active{transform:scale(.98);filter:brightness(1.06)}
.next:disabled{background:var(--panel-2);color:var(--ink-faint)}
.next:disabled:active{transform:none;filter:none}
.kbdhint{text-align:center;font-size:11px;color:var(--ink-faint);margin-top:14px}

/* ---- results ---- */
.score-hero{text-align:center;padding:10px 0 6px}
.score-ring{width:150px;height:150px;margin:0 auto 10px;position:relative}
.score-ring svg{transform:rotate(-90deg)}
.score-num{position:absolute;inset:0;display:flex;flex-direction:column;
  align-items:center;justify-content:center}
.score-num .pct{font-size:42px;font-weight:800;font-variant-numeric:tabular-nums;
  font-family:var(--serif)}
.score-num .lab{font-size:12px;color:var(--ink-dim);letter-spacing:.05em}
.score-line{text-align:center;color:var(--ink-dim);font-size:14px;margin-bottom:4px}
.score-line b{color:var(--ink)}
.grade{text-align:center;font-family:var(--serif);font-style:italic;
  font-size:17px;margin-bottom:8px}

.rlist{display:flex;flex-direction:column;gap:1px;background:var(--line);
  border-radius:var(--r-sm);overflow:hidden;border:1px solid var(--line)}
.ritem{background:var(--panel-2);padding:12px 14px;display:flex;
  align-items:center;gap:11px}
.ritem .rc{font-size:15px;flex-shrink:0}
.ritem .re{font-weight:600;font-family:var(--serif);font-style:italic;font-size:15px}
.ritem .qtag{font-family:var(--sans);font-style:normal;font-size:10px;color:var(--ink-faint);
  background:var(--panel);border:1px solid var(--line);border-radius:5px;padding:1px 5px;
  margin-left:4px;vertical-align:middle}
.ritem .rz{color:var(--ink-dim);font-size:13px;margin-left:auto;text-align:right}
.ritem .rspk{margin-left:6px;flex-shrink:0}
.ritem.wrong .rz .yours{color:var(--rose);text-decoration:line-through;
  font-size:12px;display:block}

/* ---- analysis / bars ---- */
.tbar{margin-bottom:11px}
.tbar:last-child{margin-bottom:0}
.tbar .tl{display:flex;justify-content:space-between;font-size:13px;margin-bottom:5px}
.tbar .tl .tz{color:var(--ink-dim)}
.tbar .tl .tp{font-variant-numeric:tabular-nums;font-weight:600}
.tbar .track{height:8px;background:var(--panel-2);border-radius:4px;overflow:hidden}
.tbar .track i{display:block;height:100%;border-radius:4px;transition:width .5s}
.muted{color:var(--ink-faint);font-size:13px;text-align:center;padding:20px 0}

/* ---- chart ---- */
.chart{height:130px;display:flex;align-items:flex-end;gap:0;position:relative;
  padding-top:8px}
.chartsvg{width:100%;height:130px;overflow:visible}
.chart-empty{height:130px;display:flex;align-items:center;justify-content:center;
  color:var(--ink-faint);font-size:13px}

/* ---- word chips (mastery) ---- */
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{background:var(--panel-2);border:1px solid var(--line);border-radius:20px;
  padding:6px 12px;font-size:13px;display:flex;align-items:center;gap:7px}
.chip .cn{font-variant-numeric:tabular-nums;color:var(--rose);font-weight:700;font-size:12px}
.chip .czh{color:var(--ink-faint);font-size:11px}

/* ---- stat strip ---- */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-bottom:14px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:var(--r-sm);
  padding:13px 10px;text-align:center}
.stat .sv{font-size:22px;font-weight:800;font-variant-numeric:tabular-nums;
  font-family:var(--serif)}
.stat .sl{font-size:11px;color:var(--ink-faint);margin-top:2px;letter-spacing:.03em}
.stat .sv.gold{color:var(--gold)} .stat .sv.acc{color:var(--accent)}
.statbtn{font:inherit;color:inherit;width:100%;display:block;transition:.15s}
.statbtn.live{border-color:var(--rose);cursor:pointer}
.statbtn.live .sv{color:var(--rose)}
.statbtn.live .sl{color:var(--rose)}
.statbtn:active{transform:scale(.97)}

/* ---- visit counters ---- */
.visitbar{display:flex;align-items:center;justify-content:center;gap:22px;
  margin-top:18px;padding:14px;background:var(--panel);border:1px solid var(--line);
  border-radius:var(--r-sm)}
.vitem{text-align:center}
.vitem b{display:block;font-family:var(--serif);font-size:20px;font-weight:800;
  color:var(--accent);font-variant-numeric:tabular-nums}
.vitem span{font-size:11px;color:var(--ink-faint);letter-spacing:.03em}
.vsep{width:1px;height:28px;background:var(--line)}

/* ---- backup manager ---- */
.bkrow{display:flex;align-items:center;gap:10px;padding:12px 2px;
  border-bottom:1px solid var(--line)}
.bkrow:last-child{border-bottom:none}
.bkinfo{flex:1;min-width:0}
.bkwhen{font-size:14px;font-weight:600;font-variant-numeric:tabular-nums}
.bkmeta{font-size:11.5px;color:var(--ink-faint);margin-top:2px}
.bkbtn{flex-shrink:0;font-size:12px;padding:7px 14px;border-radius:20px;
  background:var(--panel-2);border:1px solid var(--line);color:var(--ink-dim);font-weight:600}
.bkbtn:active{transform:scale(.95);background:var(--good-dim);color:var(--accent)}

.foot{text-align:center;margin-top:26px;display:flex;gap:9px;justify-content:center}
.foot button{font-size:12px;color:var(--ink-faint);padding:11px 14px;
  border:1px solid var(--line);border-radius:20px;background:var(--panel);transition:.12s}
.foot button:active{background:var(--panel-2);transform:scale(.95)}
.tag{display:inline-block;font-size:11px;padding:2px 8px;border-radius:20px;
  background:var(--rose-dim);color:var(--gold);margin-left:8px;font-weight:600;
  letter-spacing:.03em;vertical-align:middle}

.hidden{display:none!important}
.fadein{animation:fade .35s ease}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
::-webkit-scrollbar{width:0}
</style>

const todayStr = () => new Date().toLocaleDateString("sv");  // YYYY-MM-DD local
/* Monday-start ISO week helpers for the weekly goal system */
function addDays(dateStr,n){ const d=new Date(dateStr+"T00:00:00"); d.setDate(d.getDate()+n); return d.toLocaleDateString("sv"); }
function isoMonday(dateStr){ const d=new Date(dateStr+"T00:00:00"); const day=d.getDay();
  const diff=(day===0?-6:1-day); d.setDate(d.getDate()+diff); return d.toLocaleDateString("sv"); }
function weekDates(mondayStr){ const out=[]; for(let i=0;i<7;i++) out.push(addDays(mondayStr,i)); return out; }
function ensureDailyLog(dateStr){
  if(!store.dailyLog[dateStr]) store.dailyLog[dateStr]={sessions:0,questions:0,newMastered:0,newWbMastered:0,themes:[]};
  if(!store.dailyLog[dateStr].themes) store.dailyLog[dateStr].themes=[]; // back-fill older entries
  return store.dailyLog[dateStr];
}
function logThemesTouched(dateStr, themeIds){
  const e = ensureDailyLog(dateStr);
  themeIds.forEach(t=>{ if(t!=null && !e.themes.includes(t)) e.themes.push(t); });
}
function themeIdFromKey(key){ const m=/^T(\d+)\|/.exec(key); return m?+m[1]:null; }
function trimDailyLog(){
  const MAXDAYS=90; const keys=Object.keys(store.dailyLog).sort();
  if(keys.length>MAXDAYS) keys.slice(0,keys.length-MAXDAYS).forEach(k=>delete store.dailyLog[k]);
}
function blankWeekPlan(){ return { weekStart:isoMonday(todayStr()), themes:[null,null,null,null,null,null,null] }; }
/* If the stored plan belongs to a past week, archive a snapshot of how it went
   into weekHistory (capped at 12 weeks) and start a fresh blank plan for the
   current week. This is what lets the progress screen show "past weeks" trends
   without the person having to do anything. */
function rolloverWeekIfNeeded(){
  const curMonday = isoMonday(todayStr());
  if(!store.weekPlan) store.weekPlan = blankWeekPlan();
  if(store.weekPlan.weekStart === curMonday) return;
  const oldMonday = store.weekPlan.weekStart;
  if(oldMonday && oldMonday < curMonday){
    const dates = weekDates(oldMonday);
    let activeDays=0, planCompleted=0, plannedCount=0, totalQ=0, totalNew=0;
    dates.forEach((d,i)=>{
      const log = store.dailyLog[d];
      const active = !!log && ((log.sessions||0)>0 || (log.newWbMastered||0)>0);
      if(active) activeDays++;
      if(log){ totalQ+=log.questions||0; totalNew+=(log.newMastered||0)+(log.newWbMastered||0); }
      const plannedTheme = store.weekPlan.themes[i];
      if(plannedTheme!=null){
        plannedCount++;
        if(log && log.themes && log.themes.includes(plannedTheme)) planCompleted++;
      }
    });
    store.weekHistory = store.weekHistory || [];
    store.weekHistory.unshift({ weekStart:oldMonday, goalDays:store.weekGoal.days, activeDays,
      plannedCount, planCompleted, totalQ, totalNew });
    if(store.weekHistory.length>12) store.weekHistory = store.weekHistory.slice(0,12);
  }
  store.weekPlan = blankWeekPlan();
}
function blankStore(){
  return { words:{}, // "T{theme}|{en}": {r:right,w:wrong,streak:consecutiveRight}
           themeStats:{}, // theme id -> {r,w}
           history:[], // {date, pct, n}
           days:[], // distinct date strings practiced
           lastDay:null, streakDays:0, totalSessions:0,
           wbMastered:{}, // wordbook self-marked "熟背" — "T{theme}|{en}": true
           visits:{ total:0, today:0, todayDate:null, firstSeen:null },
           weekGoal:{ days:5 }, // target active days per ISO week (Mon-start)
           dailyLog:{}, // "YYYY-MM-DD": {sessions,questions,newMastered,newWbMastered,themes:[themeId,...]}
           weekPlan:{ weekStart:isoMonday(todayStr()), themes:[null,null,null,null,null,null,null] },
           weekHistory:[] }; // archived past weeks' plan-vs-actual summaries, newest first
}

/* Every field added in a later version must be back-filled here, otherwise a
   save written by an older build would come back missing keys and crash on
   property access. This is what keeps 熟背/錯題 data alive across app updates. */
function migrate(s){
  if(!s.words) s.words = {};
  if(!s.themeStats) s.themeStats = {};
  if(!s.history) s.history = [];
  if(!s.days) s.days = [];
  if(typeof s.streakDays!=="number") s.streakDays = 0;
  if(typeof s.totalSessions!=="number") s.totalSessions = 0;
  if(!s.wbMastered) s.wbMastered = {};
  if(!s.visits) s.visits = { total:0, today:0, todayDate:null, firstSeen:null };
  if(!s.weekGoal || typeof s.weekGoal.days!=="number") s.weekGoal = { days:5 };
  if(!s.dailyLog || typeof s.dailyLog!=="object" || Array.isArray(s.dailyLog)) s.dailyLog = {};
  if(!s.weekPlan || !Array.isArray(s.weekPlan.themes) || s.weekPlan.themes.length!==7)
    s.weekPlan = { weekStart:isoMonday(todayStr()), themes:[null,null,null,null,null,null,null] };
  if(!Array.isArray(s.weekHistory)) s.weekHistory = [];
  return s;
}
function load(){
  try{ const s = JSON.parse(localStorage.getItem(KEY));
    if(!s || !s.words) return blankStore();
    return migrate(s); }
  catch(e){ return blankStore(); }
}
function save(s){ try{ localStorage.setItem(KEY, JSON.stringify(s)); }catch(e){} }

/* ---------- rolling local backups ----------
   Keeps the last N snapshots of the store in a separate localStorage key.
   A snapshot is taken on every app launch BEFORE anything is mutated, so if an
   update (or a mis-tap on 重置全部) ever damages the live data, the previous
   state is still recoverable. Snapshots are skipped for empty stores so a fresh
   install can't push out real history. */
const BACKUP_KEY = KEY + "_backups";
const MAX_BACKUPS = 5;
function hasRealData(s){
  return s && (Object.keys(s.words||{}).length>0 || Object.keys(s.wbMastered||{}).length>0);
}
function readBackups(){
  try{ const b = JSON.parse(localStorage.getItem(BACKUP_KEY)); return Array.isArray(b)?b:[]; }
  catch(e){ return []; }
}
function writeBackups(list){
  try{ localStorage.setItem(BACKUP_KEY, JSON.stringify(list)); }catch(e){}
}
function snapshotBackup(s, reason, force){
  // `force` bypasses the empty-store guard: before a restore we want to capture
  // even an empty/damaged state, otherwise an accidental restore is irreversible.
  if(!force && !hasRealData(s)) return;      // nothing worth saving yet
  const list = readBackups();
  const payload = JSON.stringify(s);
  if(list.length && list[0].payload===payload) return; // identical to newest, skip
  list.unshift({ at:new Date().toISOString(), reason:reason||"launch",
                 words:Object.keys(s.words||{}).length,
                 mastered:Object.keys(s.wbMastered||{}).length,
                 payload });
  writeBackups(list.slice(0, MAX_BACKUPS));
}
function restoreBackup(idx){
  const list = readBackups();
  if(!list[idx]) return false;
  try{
    const data = migrate(JSON.parse(list[idx].payload));
    snapshotBackup(store, "before-restore", true); // so an accidental restore is itself undoable
    store = data; save(store);
    return true;
  }catch(e){ return false; }
}

/* ---------- local visit counters ---------- */
function bumpVisits(){

  const v = store.visits;
  if(!v.firstSeen) v.firstSeen = t;

/* ============ speech (Web Speech API) ============
   Browsers can only use voices installed on the device — there is no way to
   ship a specific voice. On iOS/Safari the system voices come from the same
   engine family as Siri (Samantha / Ava / Siri Voice N), so we rank those
   highest and prefer "Enhanced"/"Premium" quality variants where present.
   Elsewhere we fall back to the best-sounding en-US voice available. */
const SPEECH = {
  ok: typeof window!=="undefined" && "speechSynthesis" in window,
  voice: null,
  ready: false
};
const VOICE_PREFS = [
  /siri/i,                    // iOS "Siri Voice 1..4" when exposed
  /\bava\b/i,                 // iOS premium
  /samantha/i,                // iOS/macOS default US female — closest to Siri's timbre
  /\ballison\b|\bsusan\b|\bnicky\b/i,
  /google us english/i,       // Chrome/Android best quality
  /microsoft (aria|jenny|michelle)/i
];
function pickVoice(){
  if(!SPEECH.ok) return null;
  const all = speechSynthesis.getVoices().filter(v=>/^en(-|_)?/i.test(v.lang));
  if(!all.length) return null;
  const score = v=>{
    let s = 0;
    VOICE_PREFS.forEach((re,i)=>{ if(re.test(v.name)) s += (VOICE_PREFS.length-i)*10; });
    if(/enhanced|premium/i.test(v.name)) s += 25;   // higher-fidelity variants
    if(/compact/i.test(v.name)) s -= 15;            // low-bitrate fallback voices
    if(/en-US/i.test(v.lang)) s += 8;
    if(v.localService) s += 3;                      // offline-capable, no network hiccup
    return s;
  };
  return all.slice().sort((a,b)=>score(b)-score(a))[0] || all[0];
}
function initSpeech(){
  if(!SPEECH.ok) return;
  const set = ()=>{ SPEECH.voice = pickVoice(); SPEECH.ready = !!SPEECH.voice; };
  set();
  // voice list is populated asynchronously in most browsers
  if(typeof speechSynthesis.addEventListener==="function"){
    speechSynthesis.addEventListener("voiceschanged", set);
  } else { speechSynthesis.onvoiceschanged = set; }
}
/* strip the display-only bits so the engine reads a clean phrase:
   "Disaster / Catastrophe" -> "Disaster", "Contract/infected" -> "Contract" */
function speakableText(en){
  let s = String(en).split(/\s*\/\s*/)[0];
  s = s.replace(/\([^)]*\)/g,"").trim();
  return s || String(en);
}
function speak(en){
  if(!SPEECH.ok) return false;
  try{
    speechSynthesis.cancel();                 // never let phrases overlap
    const u = new SpeechSynthesisUtterance(speakableText(en));
    if(!SPEECH.voice) SPEECH.voice = pickVoice();
    if(SPEECH.voice){ u.voice = SPEECH.voice; u.lang = SPEECH.voice.lang; }
    else u.lang = "en-US";
    u.rate = 0.92;    // slightly under natural pace so every syllable stays crisp
    u.pitch = 1.0;
    u.volume = 1.0;
    speechSynthesis.speak(u);
    return true;
  }catch(e){ return false; }
}

/* weighting: wrongRate drives selection frequency */
function wordWeight(themeId,en){
  const st = store.words[wkey(themeId,en)];
  if(!st) return 1;               // unseen = base
  const total = st.r+st.w;
  if(total===0) return 1;
  const wrongRate = st.w/total;
  // base 1, up to +4 for high wrong rate, small boost for low exposure
  return 1 + wrongRate*4 + (total<3?0.4:0);
}
function weightedPick(pool, n){
  pool = pool.slice();
  const chosen=[];
  while(chosen.length<n && pool.length){
    const weights = pool.map(w=>wordWeight(w.t,w.en));
    let sum=weights.reduce((a,b)=>a+b,0), r=Math.random()*sum, idx=0;
    for(let i=0;i<pool.length;i++){ r-=weights[i]; if(r<=0){idx=i;break;} }
    chosen.push(pool[idx]); pool.splice(idx,1);
  }
  return chosen;
}

/* ============ session state ============ */
let S = null; // {theme, dir, weighted, questions[], idx, answers[], flags:Set}

/* build one question. dir: 'e2z' show english pick chinese, 'z2e' reverse */
/* ---- relatedness scoring for "辨析模式" distractors ---- */
const EN_SUFFIXES = ["ology","ivore","graphy","sphere","phobia","itis","osis",
  "ism","ist","tion","sion","ment","ness","ity","ance","ence","ous","ary",
  "ative","ency","scope","pathy","cyte"];
function enSuffix(w){ const l=w.toLowerCase().replace(/ /g,"");
  for(const s of EN_SUFFIXES) if(l.endsWith(s)) return s; return null; }
function enPrefix(w){ const l=w.toLowerCase(); return l.length>=5?l.slice(0,4):null; }
function zhCore(z){ return z.split(/[\/／(（]/)[0].trim(); }
/* true if a and b are cross-referenced in each other's curated SYN list —
   catches semantic near-synonyms that share no surface form at all
   (e.g. Increase/Raise, Suddenly/Abruptly) which relScore's morphology
   signals alone would miss. */
function synLinked(a,b){
  const ea = ENRICH[wkey(a.t,a.en)], eb = ENRICH[wkey(b.t,b.en)];
  const aL = a.en.toLowerCase(), bL = b.en.toLowerCase();
  if(ea && ea.syn && ea.syn.some(s=>s.toLowerCase()===bL)) return true;
  if(eb && eb.syn && eb.syn.some(s=>s.toLowerCase()===aL)) return true;
  return false;
}
function relScore(a,b){
  let s=0;
  const ca=zhCore(a.zh), cb=zhCore(b.zh);
  if(ca&&cb){
    if(ca[ca.length-1]===cb[cb.length-1]) s+=5;   // same trailing char (洋/海/星/炎/教)
    if(ca[0]===cb[0]) s+=3;                         // same leading char
    if(Math.abs(ca.length-cb.length)<=1) s+=1;      // similar length
  }
  const sa=enSuffix(a.en), sb=enSuffix(b.en);
  if(sa&&sa===sb) s+=4;                             // morphological suffix (-ivore/-ism/-itis)
  const pa=enPrefix(a.en), pb=enPrefix(b.en);
  if(pa&&pa===pb) s+=2;                             // shared prefix
  if(Math.abs(a.en.length-b.en.length)<=2) s+=1;
  if(synLinked(a,b)) s+=10;                          // curated semantic synonym — always "extremely similar"
  return s;
}
/* pick n distractor WORD objects from pool, most-related first, randomized among ties */
function relatedDistractors(target, pool, n, answerField){
  const seenVal=new Set([target[answerField]]);
  const cands=pool.filter(c=>c.en!==target.en && !seenVal.has(c[answerField]));
  // score, then bucket by score, shuffle within bucket, take from top buckets
  const scored=cands.map(c=>({c,s:relScore(target,c)}));
  scored.sort((x,y)=>y.s-x.s);
  const out=[];
  let i=0;
  while(out.length<n && i<scored.length){
    const s=scored[i].s;
    let j=i; while(j<scored.length && scored[j].s===s) j++;
    const bucket=shuffle(scored.slice(i,j).map(o=>o.c));
    for(const c of bucket){
      if(seenVal.has(c[answerField])) continue;
      seenVal.add(c[answerField]); out.push(c);
      if(out.length>=n) break;
    }
    i=j;
  }
  return out;
}

/* for e2z/z2e: threshold above which two words are considered "extremely similar"
   (near-synonym / same-cluster) and therefore excluded from appearing together as
   options — score >=7 requires 2+ strong signals stacking (e.g. same zh tail + same en suffix) */
const EXTREME_SIM_THRESHOLD = 7;

/* which question types are available for a given word */
function availableTypes(word){
  const types = ["e2z","z2e"];               // always available
  const e = ENRICH[wkey(word.t,word.en)];
  if(e){
    if(e.def) types.push("def");             // English definition -> pick word
    if(e.cloze) types.push("cloze");         // fill in the blank
    if(e.syn && e.syn.length) types.push("syn"); // synonym selection
  }
  return types;
}

/* auto-balanced question-type ratio: recognition (e2z) weighted highest since
   the app's core goal is reading recognition; other types fill out the rest. */
const TYPE_WEIGHTS = { e2z:0.30, cloze:0.20, def:0.20, z2e:0.20, syn:0.10 };
function pickQuestionType(types){
  const avail = types.filter(t=>TYPE_WEIGHTS[t]!==undefined);
  const totalW = avail.reduce((s,t)=>s+TYPE_WEIGHTS[t],0);
  let r = Math.random()*totalW;
  for(const t of avail){
    r -= TYPE_WEIGHTS[t];
    if(r<=0) return t;
  }
  return avail[avail.length-1];
}

/* per-question distractor policy: mostly related, sometimes same-theme random */
function chooseDistractorMode(){ return Math.random()<0.78; } // true = related

function buildQuestion(word, qtype, distractorPool){
  const related = chooseDistractorMode();
  const e = ENRICH[wkey(word.t,word.en)];
  let prompt, promptKind, correct, answerField, dir;

  if(qtype==="def"){          // show English definition, pick the English word
    prompt = e.def; promptKind="def"; correct=word.en; answerField="en"; dir="def";
  } else if(qtype==="cloze"){ // show sentence with blank, pick the English word
    prompt = e.cloze; promptKind="cloze"; correct=word.en; answerField="en"; dir="cloze";
  } else if(qtype==="syn"){   // show English word, pick the synonym
    prompt = word.en; promptKind="syn"; correct = e.syn[Math.floor(Math.random()*e.syn.length)];
    answerField="en"; dir="syn";
  } else {                    // e2z / z2e
    dir=qtype;
    correct = qtype==="e2z" ? word.zh : word.en;
    prompt  = qtype==="e2z" ? word.en : word.zh;
    promptKind = qtype==="e2z" ? "en" : "zh";
    answerField = qtype==="e2z" ? "zh" : "en";
  }

  const seen = new Set([correct]);
  const distract=[];

  if(qtype==="syn"){
    // distractors for synonym = other English words (not the target, not its own synonyms)
    const ownSyn = new Set((e.syn||[]).concat([word.en]));
    const relPool = related ? relatedDistractors(word, distractorPool, 12, "en")
                            : shuffle(distractorPool);
    for(const d of relPool){
      if(ownSyn.has(d.en)) continue;
      if(seen.has(d.en)) continue;
      seen.add(d.en); distract.push(d.en);
      if(distract.length===3) break;
    }
  } else if(qtype==="e2z"||qtype==="z2e"){
    // translation types: UNCONDITIONALLY exclude "extremely similar" candidates first
    // (near-synonym / same-cluster words), so this never depends on the related/random
    // coin flip below — misleading options must never appear either way.
    //
    // Critically, the exclusion is computed on the DISPLAYED VALUE, not the candidate
    // object: several different English words can share one Chinese gloss (e.g.
    // Decline/Drop/Go down all display "下降"). If ANY word sharing that displayed
    // value scores as "extremely similar" to the target, the value itself is
    // blacklisted — otherwise a different word with the same text could slip through
    // even though what the student actually sees on screen is identical either way.
    const forbiddenVals = new Set([correct]);
    distractorPool.forEach(c=>{
      if(relScore(word,c) >= EXTREME_SIM_THRESHOLD) forbiddenVals.add(c[answerField]);
    });
    const safePool = distractorPool.filter(c=>!forbiddenVals.has(c[answerField]));
    const workPool = safePool.length>=3 ? safePool : distractorPool; // fallback only if too few remain
    if(related){
      // rank the (already-safe) pool by relatedness so distractors are still
      // thematically meaningful, just not near-duplicate meanings
      const rel = relatedDistractors(word, workPool, 3, answerField);
      for(const d of rel){ const val=d[answerField];
        if(seen.has(val)) continue; seen.add(val); distract.push(val);
        if(distract.length===3) break; }
    } else {
      const pool = shuffle(workPool);
      for(const d of pool){ const val = d[answerField];
        if(seen.has(val)) continue; seen.add(val); distract.push(val);
        if(distract.length===3) break; }
    }
  } else {
    // def / cloze: relatedness-based distractor selection is fine here since
    // options are always literal English words, not translation pairs
    if(related){
      const rel = relatedDistractors(word, distractorPool, 12, answerField);
      for(const d of rel){ const val=d[answerField];
        if(seen.has(val)) continue; seen.add(val); distract.push(val);
        if(distract.length===3) break; }
    } else {
      const pool = shuffle(distractorPool);
      for(const d of pool){ const val = d[answerField];
        if(seen.has(val)) continue; seen.add(val); distract.push(val);
        if(distract.length===3) break; }
    }
  }
  // fallback to global pool if not enough unique distractors
  if(distract.length<3){
    const g = shuffle(allWords());
    for(const d of g){ const val=d[answerField];
      if(val===undefined) continue;
      if(qtype==="syn" && (e.syn||[]).includes(val)) continue;
      if(seen.has(val)) continue; seen.add(val); distract.push(val);
      if(distract.length===3) break; }
  }
  const opts = shuffle([correct,...distract]);
  return { word, dir, qtype, prompt, promptKind, correct, opts, ansField:answerField };
}

function startQuiz({themeId, reviewMode, forcedType, instantReveal}){
  const count = 25; // fixed question count, no longer user-selectable
  let pool;
  if(reviewMode){
    // gather words with net wrong history
    pool = allWords().filter(w=>{ const st=store.words[wkey(w.t,w.en)];
      return st && st.w>0 && st.streak<2; });
    if(pool.length===0){ alert("錯題本是空的 🎉 代表目前沒有需要補強的字，繼續保持！"); return; }
  } else if(themeId==="all"){
    pool = allWords();
  } else if(typeof themeId==="string" && themeId.startsWith("db")){
    pool = wordsInDb(+themeId.slice(2));
  } else {
    const t = VOCAB.find(x=>x.i===themeId);
    pool = t.w.map(([en,zh])=>({t:themeId,en,zh}));
  }
  if(forcedType){
    // restrict to words that actually support the chosen single question type
    // (e.g. not every word has a qualifying synonym for 同義辨析)
    const restricted = pool.filter(w=>availableTypes(w).includes(forcedType));
    if(restricted.length===0){
      const label = (QTYPE_META[forcedType]&&QTYPE_META[forcedType].label) || forcedType;
      alert(`這個範圍內可出「${label}」的單字不夠，換一種題型或主題就可以囉。`);
      return;
    }
    pool = restricted;
  }
  const n = Math.min(count, pool.length);
  const picked = weightedPick(pool,n);

  const questions = picked.map(w=>{
    // distractor pool: same theme if possible else same scope as the pool above
    let dp;
    if(themeId==="all"||reviewMode){ dp = allWords(); }
    else if(typeof themeId==="string" && themeId.startsWith("db")){ dp = wordsInDb(+themeId.slice(2)); }
    else { const t=VOCAB.find(x=>x.i===themeId); dp=t.w.map(([en,zh])=>({t:themeId,en,zh})); }
    dp = dp.filter(x=>x.en!==w.en);
    // forced type if chosen, else weighted-random among those available for this word
    const qtype = forcedType || pickQuestionType(availableTypes(w));
    return buildQuestion(w,qtype,dp);
  });

  S = { themeId, questions, idx:0, answers:new Array(questions.length).fill(null),
        flags:new Set(), reviewMode, forcedType, instantReveal:!!instantReveal };
  renderQuiz();
}

/* ---------- cover / home (app root) ---------- */
/* ---------- weekly smart progress tracking ----------
   A day counts as "active" if the person did a quiz session OR marked at
   least one word 熟背 that day — both signals matter, since some study
   sessions are pure recall practice (quiz) and some are pure memorization
   (wordbook). The week runs Monday→Sunday per the person's own convention.
   On top of the simple day-count goal, the person can also plan exactly
   which theme they intend to study each day; actual completion is checked
   against the themes genuinely touched that day (derived from real quiz
   questions answered and words marked 熟背, not just a guess). */
const MAX_WEEK_OFFSET = 9; // lets the person browse roughly ±2 months (9 weeks) from today
/* Build a week's activity summary for an ARBITRARY Monday, not just the current
   week. For the current week this reads the live, editable weekPlan. For past
   weeks it first checks the archived weekHistory (already computed at rollover
   time); if that week hasn't been archived yet (e.g. "last week" while still
   early in the current week) it reconstructs the same numbers on the fly from
   dailyLog. Future weeks simply have no data yet. */
function weekActivitySummaryFor(offsetWeeks){
  rolloverWeekIfNeeded();
  const curMonday = store.weekPlan.weekStart;
  const monday = offsetWeeks===0 ? curMonday : addDays(curMonday, offsetWeeks*7);
  const dates = weekDates(monday);
  const today = todayStr();
  const isCurrent = offsetWeeks===0;
  const isFutureWeek = monday > curMonday;

  // plan themes: only the CURRENT week has a live, editable plan in this version
  const planThemes = isCurrent ? store.weekPlan.themes : [null,null,null,null,null,null,null];

  let activeDays=0, totalQ=0, totalNewMastered=0, totalNewWb=0, plannedCount=0, planDone=0;
  const days = dates.map((d,i)=>{
    const log = isFutureWeek ? null : store.dailyLog[d];
    const active = !!log && ((log.sessions||0)>0 || (log.newWbMastered||0)>0);
    if(active) activeDays++;
    if(log){ totalQ+=log.questions||0; totalNewMastered+=log.newMastered||0; totalNewWb+=log.newWbMastered||0; }
    const plannedTheme = planThemes[i];
    const done = plannedTheme!=null && !!log && !!log.themes && log.themes.includes(plannedTheme);
    if(plannedTheme!=null){ plannedCount++; if(done) planDone++; }
    return { date:d, active, isToday:d===today, isFuture:d>today, isPast:d<today,
              plannedTheme, planDone:done };
  });
  return { monday, days, activeDays, totalQ, totalNewMastered, totalNewWb,
           goal:store.weekGoal.days, plannedCount, planDone, isCurrent, isFutureWeek, offsetWeeks };
}
function weekActivitySummary(){ return weekActivitySummaryFor(0); }
function weekRangeLabel(monday){
  const sunday = addDays(monday,6);
  const fmt = d=>{ const [y,m,day]=d.split("-"); return `${+m}/${+day}`; };
  return `${fmt(monday)} – ${fmt(sunday)}`;
}
function weeklyProgressCard(offsetWeeks){
  offsetWeeks = offsetWeeks||0;
  const sum = weekActivitySummaryFor(offsetWeeks);
  const dayLabels = ["一","二","三","四","五","六","日"];
  const metGoal = sum.activeDays >= sum.goal;
  const cells = sum.days.map((d,i)=>{
    let cls = "wdcell";
    if(d.active) cls += " done";
    else if(d.plannedTheme!=null && d.isPast) cls += " missed";
    else if(d.isFuture || sum.isFutureWeek) cls += " future";
    if(d.isToday) cls += " today";
    if(d.plannedTheme!=null) cls += " planned";
    const dot = d.active ? "✓" : (d.plannedTheme!=null ? "•" : "");
    return `<div class="${cls}"><span class="wdlabel">${dayLabels[i]}</span><span class="wddot">${dot}</span></div>`;
  }).join("");
  const newWordsTotal = sum.totalNewMastered + sum.totalNewWb;
  let planLine;
  if(sum.isFutureWeek) planLine = `<div class="weeksum-detail muted-hint">這週還沒開始，之後再回來看看</div>`;
  else if(sum.plannedCount>0) planLine = `<div class="weeksum-detail">本週規劃 ${sum.plannedCount} 天，已完成 ${sum.planDone} 天</div>`;
  else if(sum.isCurrent) planLine = `<div class="weeksum-detail muted-hint">還沒安排本週各天要念哪一回，點下方設定看看</div>`;
  else planLine = "";
  const heading = sum.isCurrent ? "本週進度" : weekRangeLabel(sum.monday);
  const atMin = offsetWeeks<=-MAX_WEEK_OFFSET, atMax = offsetWeeks>=MAX_WEEK_OFFSET;
  return $(`
    <div class="card weekcard" data-offset="${offsetWeeks}">
      <div class="weekhead">
        <div class="weeknav">
          <button class="weeknavbtn" id="weekprev" ${atMin?"disabled":""} aria-label="上一週">‹</button>
          <h2>${heading}</h2>
          <button class="weeknavbtn" id="weeknext" ${atMax?"disabled":""} aria-label="下一週">›</button>
        </div>
        <button class="weekgoalbtn" id="weekgoalbtn">🎯 規劃本週 ›</button>
      </div>
      <div class="weekstrip">${cells}</div>
      <div class="weeksum">
        <div class="weeksum-main ${metGoal?"met":""}">${metGoal?"🎉 本週目標已達成！":`已完成 <b>${sum.activeDays}</b> / ${sum.goal} 天`}</div>
        <div class="weeksum-detail">本週共答題 ${sum.totalQ} 題 · 新增熟悉 ${newWordsTotal} 字</div>
        ${planLine}
      </div>
      ${!sum.isCurrent?`<button class="ghost backtocurrent" id="backtocurrent">回到本週</button>`:""}
    </div>`);
}
function wireWeeklyProgressCard(node, offsetWeeks){
  offsetWeeks = offsetWeeks||0;
  const btn = node.querySelector("#weekgoalbtn");
  if(btn) btn.onclick=()=>render(screenWeekPlan());
  const prev = node.querySelector("#weekprev");
  const next = node.querySelector("#weeknext");
  const back = node.querySelector("#backtocurrent");
  if(prev) prev.onclick=()=>{ if(!prev.disabled) render(screenModeSelect(offsetWeeks-1)); };
  if(next) next.onclick=()=>{ if(!next.disabled) render(screenModeSelect(offsetWeeks+1)); };
  if(back) back.onclick=()=>render(screenModeSelect(0));
}
function goalHintFor(n){
  if(n<=2) return "輕鬆起步，先養成習慣就好";
  if(n<=4) return "穩定的學習節奏，很適合長期維持";
  if(n<=6) return "積極衝刺，進步幅度會很明顯";
  return "全勤模式，一週七天都不缺席 🔥";
}
/* recommend themes for auto-fill: untouched themes first, then touched
   themes sorted by weakest accuracy — always the highest-value place to
   spend the next study session */
function smartSuggestThemes(count){
  const scored = VOCAB.map(t=>{
    const st = store.themeStats[t.i];
    const touched = !!st && (st.r+st.w)>0;
    const acc = touched ? st.r/(st.r+st.w) : -1;
    return {id:t.i, acc};
  });
  scored.sort((a,b)=>a.acc-b.acc);
  return scored.slice(0,count).map(s=>s.id);
}
function themeSelectOptionsHTML(selectedThemeId){
  let html = `<option value="" ${selectedThemeId==null?"selected":""}>— 尚未安排 —</option>`;
  DATABASES.forEach(db=>{
    html += `<optgroup label="${db.emoji} ${db.name}">`;
    themesInDb(db.id).forEach(t=>{
      html += `<option value="${t.i}" ${selectedThemeId===t.i?"selected":""}>${t.i}. ${escAttr(t.n)}</option>`;
    });
    html += `</optgroup>`;
  });
  return html;
}
function weekHistoryInsightHTML(){
  if(!store.weekHistory.length) return "";
  const recent = store.weekHistory.slice(0,4);
  const metCount = recent.filter(w=>w.activeDays>=w.goalDays).length;
  const planWeeks = recent.filter(w=>w.plannedCount>0);
  const planRate = planWeeks.length
    ? Math.round(planWeeks.reduce((s,w)=>s+w.planCompleted,0)/planWeeks.reduce((s,w)=>s+w.plannedCount,0)*100)
    : null;
  return `<div class="card insightcard">
      <h2>📈 智慧洞察</h2>
      <div class="insightline">過去 ${recent.length} 週，有 <b>${metCount}</b> 週達成目標天數</div>
      ${planRate!=null?`<div class="insightline">有規劃的日子裡，完成率 <b>${planRate}%</b></div>`:""}
    </div>`;
}
function screenWeekPlan(){
  rolloverWeekIfNeeded(); save(store);
  const node = $(`<div class="fadein"></div>`);

  const card = $(`
    <div class="card goalcard">

  node.appendChild(card);

  const range = card.querySelector("#goalrange");
  function update(n){
    n = Math.max(1, Math.min(7, n));

  range.oninput = ()=>update(+range.value);
  card.querySelector("#stepdown").onclick = ()=>update(+range.value-1);

  // per-day theme plan
  const dayLabels = ["週一","週二","週三","週四","週五","週六","週日"];
  const dates = weekDates(store.weekPlan.weekStart);
  const today = todayStr();
  const planCard = $(`<div class="card"><h2>每日安排</h2>
      <button class="ghost" id="autofill" style="margin-bottom:14px">🎲 幫我自動安排（依弱點推薦）</button>
      <div class="planlist" id="planlist"></div>
    </div>`);
  const planlist = planCard.querySelector("#planlist");
  function renderPlanRows(){
    planlist.innerHTML="";
    dates.forEach((d,i)=>{
      const plannedThemeId = store.weekPlan.themes[i];
      const log = store.dailyLog[d];
      const done = plannedThemeId!=null && !!log && !!log.themes && log.themes.includes(plannedThemeId);
      const row = $(`
        <div class="planrow ${d===today?"today":""}">
          <div class="plandate"><span class="plw">${dayLabels[i]}</span><span class="pld">${d.slice(5)}</span></div>

      planlist.appendChild(row);
    });
    planlist.querySelectorAll(".planselect").forEach(sel=>sel.onchange=()=>{
      const day = +sel.dataset.day;
      const val = sel.value;
      store.weekPlan.themes[day] = val===""?null:+val;
      save(store);
      renderPlanRows();
    });
  }
  renderPlanRows();
  node.appendChild(planCard);

  planCard.querySelector("#autofill").onclick=()=>{
    const suggestions = smartSuggestThemes(7);
    store.weekPlan.themes = suggestions;
    save(store);
    renderPlanRows();
  };

  const insight = weekHistoryInsightHTML();
  if(insight) node.appendChild($(insight));

  node.appendChild($(`<button class="go" id="savegoal" style="margin-top:18px">儲存目標天數</button>`));
  node.querySelector("#savegoal").onclick=()=>{
    store.weekGoal.days = +range.value; save(store);
    render(screenModeSelect());
  };
  node.querySelector("#backhome").onclick=()=>{ store.weekGoal.days=+range.value; save(store); render(screenModeSelect()); };
  return node;
}

  const list = readBackups();
  const card = $(`<div class="card"><h2>可用的備份</h2><div id="bklist"></div></div>`);
  const holder = card.querySelector("#bklist");
  if(list.length===0){
    holder.appendChild($(`<div class="muted">還沒有任何備份快照，開始練習之後就會自動建立囉。</div>`));
  }else{
    list.forEach((b,i)=>{
      const d = new Date(b.at);
      const when = `${d.getFullYear()}/${String(d.getMonth()+1).padStart(2,"0")}/${String(d.getDate()).padStart(2,"0")} ${String(d.getHours()).padStart(2,"0")}:${String(d.getMinutes()).padStart(2,"0")}`;
      const row = $(`

            <div class="bkwhen">${when}${i===0?'<span class="tag">最新</span>':""}</div>
            <div class="bkmeta">練過 ${b.words} 字 · 熟背 ${b.mastered} 字</div>
          </div>
          <button class="bkbtn" data-i="${i}">還原</button>
        </div>`);
      holder.appendChild(row);
    });
  }
  node.appendChild(card);

  node.appendChild($(`<div class="opt-hint" style="margin:10px 2px">小提醒：更新 App 版本並不會清掉你的紀錄，資料是跟著網址走的。這裡的備份只是多一層保險。</div>`));

  holder.querySelectorAll(".bkbtn").forEach(btn=>btn.onclick=()=>{
    const i = +btn.dataset.i;
    const b = readBackups()[i];
    if(!b) return;
    if(!confirm(`確定要還原到這份備份嗎？\n練過 ${b.words} 字 · 熟背 ${b.mastered} 字\n\n目前的資料會先自動存成一份備份，所以隨時可以再換回來。`)) return;
    if(restoreBackup(i)){ alert("還原完成 ✅ 你的紀錄都回來了"); render(screenModeSelect()); }
    else alert("還原失敗，這份備份檔可能已經損壞了");
  });
  node.querySelector("#backhome").onclick=()=>render(screenModeSelect());
  return node;
}

function screenWordbookList(themeId){
  const t = VOCAB.find(x=>x.i===themeId);
  const node = $(`<div class="fadein"></div>`);
  node.appendChild($(`<button class="backlink" id="backbook">‹ 返回</button>`));
  node.appendChild($(`
    <div class="top">
      <div class="titlewrap">
        <div class="brand" style="font-size:19px">${t.i}. ${t.n}</div>
      </div>
      <button class="masktoggle" id="masktoggle">🙈 遮住中文</button>
    </div>`));
  node.appendChild($(`<div class="opt-hint" style="margin:-8px 2px 14px">${t.z||""} · 共 ${t.w.length} 字 · 遮住後，點單一中文即可單獨顯示</div>`));

  const listCard = $(`<div class="card" style="padding:6px 4px"><div class="wblist" id="wblist"></div></div>`);
  node.appendChild(listCard);
  const list = listCard.querySelector("#wblist");

  let maskedGlobal = false;
  let revealedSet = new Set();

  function renderList(){
    list.innerHTML = "";
    const withIdx = t.w.map(([en,zh],idx)=>({en,zh,idx}));
    const notMastered = withIdx.filter(w=>!store.wbMastered[wkey(t.i,w.en)]);
    const masteredList = withIdx.filter(w=>store.wbMastered[wkey(t.i,w.en)]);
    [...notMastered, ...masteredList].forEach(w=>{
      const key = wkey(t.i,w.en);
      const isMastered = !!store.wbMastered[key];
      const isRevealed = !maskedGlobal || revealedSet.has(key);
      const row = $(`
        <div class="wbrow ${isMastered?"mastered":""}">
          <span class="wbn">${w.idx+1}</span>
          <span class="wben">${w.en}</span>
          ${volBtnHTML(w.en)}
          <span class="wbzh ${isRevealed?"":"masked"}" data-key="${key}">${isRevealed?w.zh:"遮住"}</span>
          <button class="wbmaster ${isMastered?"on":""}" data-key="${key}">${isMastered?"✓ 已熟背":"熟背"}</button>
        </div>`);
      list.appendChild(row);
    });
    list.querySelectorAll(".volbtn").forEach(btn=>btn.onclick=(e)=>{
      e.stopPropagation();
      const okSpeak = speak(btn.dataset.en);
      if(!okSpeak){ alert("這個瀏覽器不支援語音朗讀，用 Safari 或 Chrome 開啟就可以聽了"); return; }
      btn.classList.add("playing");
      setTimeout(()=>btn.classList.remove("playing"), 700);
    });
    list.querySelectorAll(".wbzh").forEach(el=>el.onclick=()=>{
      if(!maskedGlobal) return; // nothing to toggle when the global mask is off
      const key = el.dataset.key;
      if(revealedSet.has(key)) revealedSet.delete(key); else revealedSet.add(key);
      renderList();
    });
    list.querySelectorAll(".wbmaster").forEach(btn=>btn.onclick=(e)=>{
      e.stopPropagation();
      const key = btn.dataset.key;
      if(store.wbMastered[key]){ delete store.wbMastered[key]; }
      else {
        store.wbMastered[key] = true;
        // Marking a word as 熟背 means "I know this one", so its meaning should go
        // back under the mask instead of staying exposed from an earlier peek.
        revealedSet.delete(key);
        // this also counts as meaningful daily study activity for the weekly goal
        ensureDailyLog(todayStr()).newWbMastered += 1;
        logThemesTouched(todayStr(), [themeIdFromKey(key)]);
        trimDailyLog();
      }
      save(store);
      renderList();
    });
  }
  renderList();

  const maskBtn = node.querySelector("#masktoggle");
  maskBtn.onclick=()=>{
    maskedGlobal = !maskedGlobal;
    revealedSet = new Set(); // reset individual reveals whenever the global mask is toggled
    maskBtn.textContent = maskedGlobal ? "👁 顯示中文" : "🙈 遮住中文";
    renderList();
  };

  node.querySelector("#backbook").onclick=()=>render(screenWordbookHome(t.db));
  return node;
}

/* ---------- quiz ---------- */
const QTYPE_META = {
  e2z:  {label:"英文 → 中文", sub:"選出正確的中文意思",   promptCls:"en"},
  z2e:  {label:"中文 → 英文", sub:"選出正確的英文單字",   promptCls:"zh"},
  def:  {label:"英文釋義",     sub:"選出符合此定義的單字", promptCls:"def"},
  cloze:{label:"語境填空",     sub:"選出最適合填入空格的單字", promptCls:"cloze"},
  syn:  {label:"同義辨析",     sub:"選出意思最接近的單字", promptCls:"en"}
};
function renderQuiz(){
  const q = S.questions[S.idx];
  const node = $(`<div class="fadein"></div>`);
  const meta = QTYPE_META[q.qtype] || QTYPE_META.e2z;
  node.appendChild($(`
    <div class="qhead">
      <div class="qmeta">第 <b>${S.idx+1}</b> / ${S.questions.length} 題${S.reviewMode?'<span class="tag">錯題複習</span>':''}</div>
      <button class="quit" id="quit">結束</button>
    </div>`));
  node.appendChild($(`<div class="prog"><i style="width:${(S.idx)/S.questions.length*100}%"></i></div>`));

  // cloze: highlight the blank
  let promptHtml = q.prompt;
  if(q.qtype==="cloze") promptHtml = q.prompt.replace("______","<span class='blank'>______</span>");

  node.appendChild($(`
    <div class="qdir">${meta.label}</div>
    <div class="qword ${meta.promptCls}">${promptHtml}</div>
    <div class="qsub">${meta.sub}</div>`));

  const choices = $(`<div class="choices"></div>`);
  const keys=["1","2","3","4"];
  q.opts.forEach((opt,i)=>{
    const c=$(`<button class="choice" data-i="${i}">
      <span class="key">${keys[i]}</span><span class="ctext">${opt}</span></button>`);
    c.onclick=()=>pick(i);
    choices.appendChild(c);
  });
  node.appendChild(choices);

  // feedback banner — only ever populated in instant-reveal mode
  const feedback = $(`<div class="feedback" id="feedback"></div>`);
  node.appendChild(feedback);

  const flagged = S.flags.has(S.idx);
  node.appendChild($(`
    <div class="qfoot">
      <button class="flag ${flagged?'on':''}" id="flag" title="標記猜的" aria-label="${flagged?'取消標記':'標記這題是用猜的'}">${flagged?'🚩':'🏳️'}</button>
      <button class="next" id="next" ${S.answers[S.idx]==null?'disabled':''}>
        ${S.idx===S.questions.length-1?'看結果':'下一題'}</button>
    </div>`));
  node.appendChild($(`<div class="kbdhint">按 1–4 選答案 · Enter 下一題 · F 標記</div>`));

  let answered = S.answers[S.idx]!=null;

  // paint correct/wrong state onto the choice buttons + feedback banner
  // (only called in instant-reveal mode, once an answer is locked in)
  function paintReveal(){
    const pickedIdx = S.answers[S.idx];
    const pickedVal = q.opts[pickedIdx];
    const ok = pickedVal===q.correct;
    choices.querySelectorAll(".choice").forEach(x=>{
      const val = q.opts[+x.dataset.i];
      x.classList.toggle("pick", +x.dataset.i===pickedIdx);
      x.classList.toggle("correct", val===q.correct);
      x.classList.toggle("wrong", +x.dataset.i===pickedIdx && !ok);
      x.classList.add("locked");
    });
    feedback.className = "feedback show "+(ok?"ok":"bad");
    feedback.textContent = ok ? "✅ 答對了！" : `❌ 答錯了，正確答案是「${q.correct}」`;
  }

  // preselect if returning to an already-answered question
  if(answered){
    if(S.instantReveal){ paintReveal(); }
    else {
      const sel=choices.querySelector(`[data-i="${S.answers[S.idx]}"]`);
      if(sel) sel.classList.add("pick");
    }
  }

  function pick(i){
    if(S.instantReveal && answered) return; // locked once revealed — no changing your mind
    S.answers[S.idx]=i;
    if(S.instantReveal){ answered=true; paintReveal(); }
    else {
      choices.querySelectorAll(".choice").forEach(x=>x.classList.remove("pick"));
      choices.querySelector(`[data-i="${i}"]`).classList.add("pick");
    }
    node.querySelector("#next").disabled=false;
  }
  node.querySelector("#flag").onclick=()=>{
    if(S.flags.has(S.idx)) S.flags.delete(S.idx); else S.flags.add(S.idx);
    renderQuiz();
  };
  node.querySelector("#next").onclick=()=>{
    if(S.answers[S.idx]==null)return;
    if(S.idx===S.questions.length-1) finishQuiz();
    else { S.idx++; renderQuiz(); }
  };
  node.querySelector("#quit").onclick=()=>{
    if(confirm("要結束這次測驗嗎？這次的作答不會被記錄。")) render(screenQuizHome());
  };

  // keyboard
  document.onkeydown=(e)=>{
    if(e.key>="1"&&e.key<="4"){ const i=+e.key-1; if(i<q.opts.length) pick(i); }
    else if(e.key==="Enter"){ const nx=node.querySelector("#next"); if(!nx.disabled) nx.click(); }
    else if(e.key.toLowerCase()==="f"){ node.querySelector("#flag").click(); }
  };
  render(node);
}

/* ---------- finish & commit ---------- */
function finishQuiz(){
  document.onkeydown=null;
  let right=0, newlyMastered=0;
  const detail=[];
  S.questions.forEach((q,i)=>{
    const picked = q.opts[S.answers[i]];
    const ok = picked===q.correct;
    if(ok) right++;
    // commit word stat
    const k=wkey(q.word.t,q.word.en);
    const st = store.words[k] || {r:0,w:0,streak:0};
    const wasMastered = st.streak>=3;
    if(ok){ st.r++; st.streak=(st.streak||0)+1; }
    else { st.w++; st.streak=0; }
    if(!wasMastered && st.streak>=3) newlyMastered++;
    store.words[k]=st;
    // theme stat
    const ts = store.themeStats[q.word.t] || {r:0,w:0};
    ok?ts.r++:ts.w++; store.themeStats[q.word.t]=ts;
    detail.push({q,picked,ok,flagged:S.flags.has(i)});
  });
  const pct = Math.round(right/S.questions.length*100);
  const d = todayStr();
  store.history.push({date:d,pct,n:S.questions.length});
  if(store.history.length>60) store.history=store.history.slice(-60);
  // streak days
  if(store.lastDay!==d){
    const yest = new Date(Date.now()-864e5).toLocaleDateString("sv");
    if(store.lastDay===yest) store.streakDays++;
    else store.streakDays=1;
    store.lastDay=d;
    if(!store.days.includes(d)) store.days.push(d);
  }
  store.totalSessions=(store.totalSessions||0)+1;
  // weekly-goal daily activity log
  const dayLog = ensureDailyLog(d);
  dayLog.sessions += 1;
  dayLog.questions += S.questions.length;
  dayLog.newMastered += newlyMastered;
  logThemesTouched(d, [...new Set(S.questions.map(q=>q.word.t))]);
  trimDailyLog();
  rolloverWeekIfNeeded();
  save(store);
  renderResults(detail,right,pct);
}

/* ---------- results ---------- */
function renderResults(detail,right,pct){
  const node=$(`<div class="fadein"></div>`);
  const total=detail.length;
  const wrongs=detail.filter(d=>!d.ok);
  const flags=detail.filter(d=>d.flagged);
  const color = pct>=85?"var(--good)":pct>=70?"var(--gold)":"var(--rose)";
  const circ=2*Math.PI*66, off=circ*(1-pct/100);

  node.appendChild($(`<div class="top"><div class="brand">測驗結果</div></div>`));

  node.appendChild($(`
    <div class="card">
      <div class="score-hero">
        <div class="score-ring">
          <svg width="150" height="150" viewBox="0 0 150 150">
            <circle cx="75" cy="75" r="66" fill="none" stroke="var(--panel-2)" stroke-width="10"/>
            <circle cx="75" cy="75" r="66" fill="none" stroke="${color}" stroke-width="10"
              stroke-linecap="round" stroke-dasharray="${circ}" stroke-dashoffset="${off}"/>
          </svg>
          <div class="score-num"><div class="pct" style="color:${color}">${pct}%</div>
            <div class="lab">${right} / ${total} 答對</div></div>
        </div>
        <div class="grade">「${gradeText(pct)}」</div>
      </div>
    </div>`));

  // wrong list
  if(wrongs.length){
    const wc=$(`<div class="card"><h2>答錯的字 · ${wrongs.length}</h2><div class="rlist"></div></div>`);
    const list=wc.querySelector(".rlist");
    const TLAB={e2z:"英→中",z2e:"中→英",def:"釋義",cloze:"填空",syn:"同義"};
    wrongs.forEach(d=>{
      const {q,picked}=d;
      list.appendChild($(`
        <div class="ritem wrong">
          <span class="rc">✕</span>
          <span class="re">${q.word.en} <span class="qtag">${TLAB[q.qtype]||""}</span></span>
          ${volBtnHTML(q.word.en, "rspk")}
          <span class="rz">${q.word.zh}
            <span class="yours">你選：${picked}</span></span>
        </div>`));
    });
    list.querySelectorAll(".volbtn").forEach(btn=>btn.onclick=(e)=>{
      e.stopPropagation();
      if(!speak(btn.dataset.en)) return;
      btn.classList.add("playing");
      setTimeout(()=>btn.classList.remove("playing"), 700);
    });
    node.appendChild(wc);
  } else {
    node.appendChild($(`<div class="card"><div class="muted">🎉 全對，你很棒耶！這一輪一題都沒漏掉 👏✨</div></div>`));
  }

  // flagged-but-correct (guessed right)
  const luckyGuess = flags.filter(d=>d.ok);
  if(luckyGuess.length){
    const fc=$(`<div class="card"><h2>標記為用猜的 · ${luckyGuess.length}（雖然答對，還是建議複習）</h2><div class="rlist"></div></div>`);
    const list=fc.querySelector(".rlist");
    luckyGuess.forEach(d=>{
      list.appendChild($(`<div class="ritem"><span class="rc">🚩</span>
        <span class="re">${d.q.word.en}</span>
        <span class="rz">${d.q.word.zh}</span></div>`));
    });
    node.appendChild(fc);
  }

  node.appendChild($(`<button class="go" id="again">再測一次（同樣設定）</button>`));
  if(wrongs.length)
    node.appendChild($(`<button class="go rev" id="revnow" style="margin-top:9px">立即複習這 ${wrongs.length} 個錯字</button>`));
  node.appendChild($(`<button class="ghost" id="ana">看弱點分析</button>`));
  node.appendChild($(`<button class="ghost" id="home">回首頁</button>`));

  const sameSettings={themeId:S.themeId, reviewMode:S.reviewMode, forcedType:S.forcedType, instantReveal:S.instantReveal};
  node.querySelector("#again").onclick=()=>startQuiz(sameSettings);
  const rn=node.querySelector("#revnow");
  if(rn) rn.onclick=()=>{
    // build a quiz purely from these wrong words, respecting the forced type if one was set
    const words=wrongs.map(d=>({t:d.q.word.t,en:d.q.word.en,zh:d.q.word.zh}));
    const questions=words.map(w=>{
      const t=VOCAB.find(x=>x.i===w.t); const dp=t.w.map(([en,zh])=>({t:w.t,en,zh})).filter(x=>x.en!==w.en);
      const qtype = S.forcedType || pickQuestionType(availableTypes(w));
      return buildQuestion(w,qtype,dp);
    });
    S={themeId:S.themeId,questions,idx:0,answers:new Array(questions.length).fill(null),
       flags:new Set(),reviewMode:true,forcedType:S.forcedType,instantReveal:S.instantReveal};
    renderQuiz();
  };
  node.querySelector("#ana").onclick=screenAnalysis;
  node.querySelector("#home").onclick=()=>render(screenQuizHome());
  render(node);
}

/* ---------- analysis ---------- */
function screenAnalysis(){
  const node=$(`<div class="fadein"></div>`);
  node.appendChild($(`
    <div class="top"><div class="brand">弱點分析</div>
      <button class="quit" id="home2">回首頁</button></div>`));

  // theme accuracy ranking
  const rows=VOCAB.map(t=>{
    const st=store.themeStats[t.i]; const tot=st?st.r+st.w:0;
    const acc=tot?st.r/tot*100:null;
    return {name:t.n, id:t.i, acc, tot};
  }).filter(r=>r.tot>0).sort((a,b)=>a.acc-b.acc);

  const tc=$(`<div class="card"><h2>各主題正確率（由弱到強）</h2></div>`);
  if(rows.length===0){ tc.appendChild($(`<div class="muted">還沒有測驗紀錄喔</div>`)); }
  else rows.forEach(r=>{
    const col=r.acc>=85?"var(--good)":r.acc>=70?"var(--gold)":"var(--rose)";
    tc.appendChild($(`
      <div class="tbar">
        <div class="tl"><span class="tz">${r.id}. ${r.name}</span>
          <span class="tp" style="color:${col}">${Math.round(r.acc)}% · ${r.tot}題</span></div>
        <div class="track"><i style="width:${r.acc}%;background:${col}"></i></div>
      </div>`));
  });
  node.appendChild(tc);

  // frequently-wrong words
  const wrongWords=Object.entries(store.words)
    .map(([k,v])=>({k,...v}))
    .filter(v=>v.w>=2)
    .sort((a,b)=>b.w-a.w).slice(0,30);
  const fc=$(`<div class="card"><h2>常錯單字 · 錯 ≥2 次</h2></div>`);
  if(wrongWords.length===0) fc.appendChild($(`<div class="muted">目前還沒有錯超過 2 次的字 👍</div>`));
  else{
    const chips=$(`<div class="chips"></div>`);
    wrongWords.forEach(v=>{
      const [tid,en]=v.k.split("|"); const t=VOCAB.find(x=>x.i===+tid.slice(1));
      const zh=t?.w.find(w=>w[0]===en)?.[1]||"";
      chips.appendChild($(`<div class="chip">${en}<span class="czh">${zh}</span><span class="cn">✕${v.w}</span></div>`));
    });
    fc.appendChild(chips);
  }
  node.appendChild(fc);

  // learning curve
  const cc=$(`<div class="card"><h2>學習曲線 · 每次正確率</h2></div>`);
  const h=store.history.slice(-20);
  if(h.length<2) cc.appendChild($(`<div class="chart-empty">完成 2 次測驗後就會顯示趨勢</div>`));
  else{
    const w=100,ht=100, n=h.length;
    const pts=h.map((d,i)=>[i/(n-1)*w, ht-d.pct/100*ht]);
    const path=pts.map((p,i)=>(i?"L":"M")+p[0].toFixed(1)+" "+p[1].toFixed(1)).join(" ");
    const area=path+` L ${w} ${ht} L 0 ${ht} Z`;
    const dots=pts.map(p=>`<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="1.6" fill="var(--accent)"/>`).join("");
    cc.appendChild($(`
      <svg class="chartsvg" viewBox="0 0 100 100" preserveAspectRatio="none">
        <line x1="0" y1="30" x2="100" y2="30" stroke="var(--line)" stroke-width=".4" stroke-dasharray="2"/>
        <line x1="0" y1="15" x2="100" y2="15" stroke="var(--line)" stroke-width=".4" stroke-dasharray="2"/>
        <path d="${area}" fill="var(--accent)" opacity=".08"/>
        <path d="${path}" fill="none" stroke="var(--accent)" stroke-width="1.2"
          stroke-linejoin="round" vector-effect="non-scaling-stroke"/>
        ${dots}
      </svg>
      <div style="display:flex;justify-content:space-between;font-size:11px;color:var(--ink-faint);margin-top:6px">
        <span>${h[0].date.slice(5)}</span><span>最新 ${h[h.length-1].pct}%</span></div>`));
  }
  node.appendChild(cc);

  // mastery summary
  const words=Object.values(store.words);
  const mastered=words.filter(w=>w.streak>=3).length;
  const learning=words.filter(w=>w.streak<3&&(w.r+w.w)>0).length;
  node.appendChild($(`
    <div class="stats">
      <div class="stat"><div class="sv gold">${mastered}</div><div class="sl">已掌握 ✓✓✓</div></div>
      <div class="stat"><div class="sv acc">${learning}</div><div class="sl">學習中</div></div>
      <div class="stat"><div class="sv">${TOTAL-mastered-learning}</div><div class="sl">尚未接觸</div></div>
    </div>`));

  node.appendChild($(`<button class="ghost" id="home3">回首頁</button>`));
  node.querySelector("#home2").onclick=()=>render(screenQuizHome());
  node.querySelector("#home3").onclick=()=>render(screenQuizHome());
  render(node);
}

/* ---------- export / import ---------- */
function doExport(){
  const blob=new Blob([JSON.stringify(store)],{type:"application/json"});
  const url=URL.createObjectURL(blob);
  const a=document.createElement("a");
  a.href=url; a.download="ielts_progress_"+todayStr()+".json"; a.click();
  URL.revokeObjectURL(url);
}
function doImport(){
  const inp=document.createElement("input");
  inp.type="file"; inp.accept=".json,application/json";
  inp.onchange=()=>{ const f=inp.files[0]; if(!f)return;
    const r=new FileReader();
    r.onload=()=>{ try{ const d=JSON.parse(r.result);
      if(d&&d.words){
        snapshotBackup(store, "before-import"); // current data stays recoverable
        store=migrate(d); save(store); render(screenQuizHome());
        alert("匯入完成 ✅ 你的學習紀錄都回來了"); } else alert("這個檔案格式不太對，請確認是從這個 App 匯出的備份檔"); }
      catch(e){ alert("讀不到這個檔案，可能已經損壞，換一個備份檔試試看"); } };
    r.readAsText(f); };
  inp.click();
}

/* ============ boot ============ */
initSpeech();
bumpVisits();
rolloverWeekIfNeeded();
save(store);
render(screenModeSelect());
</script>
